name: Build packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Python deps
        run: python -m pip install -r requirements.txt PyQt6-Charts pyinstaller
      - name: Self-contained .deb
        run: ./scripts/build_deb_bundle.sh
      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: delltemp-linux
          path: build/delltemp_*_amd64.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: python -m pip install -r requirements.txt PyQt6-Charts pyinstaller
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/delltemp.spec
      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(python -c 'import sys; sys.path.insert(0,"src"); from delltemp import __version__; print(__version__)')" >> "$GITHUB_OUTPUT"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build EXE installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" packaging\delltemp.iss
      - name: Install WiX
        run: choco install wixtoolset -y --no-progress
      - name: Build MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wix\heat.exe")) { $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin" }
          $env:PATH = "$wix;$env:PATH"
          heat.exe dir dist\DellTemp -cg AppFiles -gg -sfrag -srd -sreg -dr INSTALLFOLDER -out build\harvested.wxs
          candle.exe -nologo -arch x64 "-dProductVersion=${{ steps.version.outputs.value }}" "-dIconFile=$PWD\packaging\delltemp.ico" packaging\delltemp.wxs build\harvested.wxs -o build\
          light.exe -nologo build\delltemp.wixobj build\harvested.wixobj -o "dist\DellTemp-${{ steps.version.outputs.value }}.msi"
      - name: Zip portable app
        shell: pwsh
        run: Compress-Archive -Path dist\DellTemp -DestinationPath "dist\DellTemp-${{ steps.version.outputs.value }}-windows-portable.zip"
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: delltemp-windows
          path: |
            dist/DellTemp-*-Setup.exe
            dist/DellTemp-*.msi
            dist/DellTemp-*-windows-portable.zip
